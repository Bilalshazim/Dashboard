<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>LRM Export Portal — FY 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070a14;--card:rgba(255,255,255,0.04);--card2:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.05);
  --text:#eef2ff;--muted:#8a96b8;--muted2:#6878a0;
  --mint:#5eead4;--violet:#a78bfa;--rose:#fb7185;--gold:#fbbf24;--sky:#38bdf8;--green:#34d399;
}
html,body{height:100%;font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(ellipse 600px 400px at 12% 8%,rgba(94,234,212,0.16),transparent),
  radial-gradient(ellipse 500px 500px at 88% 15%,rgba(167,139,250,0.14),transparent),
  radial-gradient(ellipse 700px 400px at 50% 105%,rgba(56,189,248,0.10),transparent);
  filter:blur(50px);animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-25px,18px) scale(1.08)}}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:5px}

/* Login gate */
#gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.gate-card{position:relative;width:360px;max-width:100%;background:var(--card);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:24px;padding:36px 30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.gate-logo{width:60px;height:60px;border-radius:16px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:#ffffff;box-shadow:0 8px 30px rgba(30,158,90,0.4)}
.gate-card h2{font-size:18px;font-weight:800}
.gate-card p{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.03em}
.gate-card input{width:100%;margin-top:22px;padding:13px 16px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;outline:none;text-align:center;letter-spacing:.1em;font-family:'Sora',sans-serif}
.gate-card input:focus{border-color:var(--mint)}
.gate-err{font-size:11px;color:var(--rose);height:15px;margin-top:8px}
.gate-card button{width:100%;margin-top:8px;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,#5eead4,#38bdf8);color:#06121a;font-size:14px;font-weight:700;cursor:pointer;font-family:'Sora',sans-serif}
.gate-card button:active{transform:scale(.98)}

/* Shell */
#app{display:none;position:relative;z-index:1;min-height:100vh;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{width:46px;height:46px;border-radius:13px;background:#ffffff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(30,158,90,0.35);flex-shrink:0}
.brand h1{font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1}
.brand p{font-size:11px;color:var(--muted);margin-top:3px}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sync-pill{font-size:11px;padding:7px 13px;border-radius:30px;font-weight:600;cursor:pointer;white-space:nowrap;border:1px solid}
.sync-live{background:rgba(94,234,212,0.1);border-color:rgba(94,234,212,0.3);color:var(--mint)}
.sync-cache{background:rgba(251,191,36,0.1);border-color:rgba(251,191,36,0.3);color:var(--gold)}

/* Tabs */
.tabs{display:flex;gap:6px;padding:0 22px;flex-wrap:wrap}
.tab{padding:11px 18px;border-radius:12px 12px 0 0;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:none;font-family:'Sora',sans-serif;display:flex;align-items:center;gap:7px;transition:.2s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);background:var(--card);border:1px solid var(--border);border-bottom:none}
.tabpane{display:none;padding:18px 22px 40px}
.tabpane.active{display:block;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.glass{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:20px;padding:22px;position:relative;overflow:hidden}
.sec-title{font-size:13px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:8px}

/* Hero */
.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.hero-main{background:linear-gradient(135deg,rgba(94,234,212,0.12),rgba(167,139,250,0.08))}
.hero-k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.hero-big{font-size:42px;font-weight:800;font-family:'JetBrains Mono',monospace;margin:8px 0;background:linear-gradient(135deg,#5eead4,#38bdf8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.hero-sub{font-size:12px;color:var(--muted)}
.mini-v{font-size:28px;font-weight:800;font-family:'JetBrains Mono',monospace;margin:6px 0;line-height:1}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.kpi{padding:18px;border-radius:16px;background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--border);transition:.3s}
.kpi:hover{transform:translateY(-3px);border-color:rgba(94,234,212,0.3)}
.kpi-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:11px}
.kpi-v{font-size:23px;font-weight:800;font-family:'JetBrains Mono',monospace;line-height:1}
.kpi-l{font-size:10px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.06em}

/* Upcoming */
.up-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.up-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.up-card{background:rgba(255,255,255,0.03);border:1px solid var(--border2);border-radius:13px;padding:12px 14px;transition:.2s}
.up-card:hover{background:var(--card2)}
.up-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:3px}
.up-name{font-size:12px;font-weight:600;line-height:1.3}
.up-amt{font-size:13px;font-weight:800;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.up-meta{font-size:10px;color:var(--muted);margin-bottom:7px}
.up-badge{font-size:9px;padding:2px 8px;border-radius:20px;font-weight:700;border:1px solid}
.up-empty{font-size:11px;color:var(--muted);text-align:center;padding:18px;grid-column:span 2}

/* Charts */
.charts{display:grid;grid-template-columns:1.7fr 1fr;gap:14px;margin-bottom:14px}
.chart-wrap{width:100%;height:180px;position:relative}
canvas{display:block;max-width:100%}
.legend{display:flex;gap:14px;margin-top:8px}
.legend-i{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted)}
.legend-d{width:9px;height:9px;border-radius:3px}

/* Bottom grid */
.bgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.cust-item{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.cust-top{display:flex;justify-content:space-between;font-size:12px}
.cust-top b{font-weight:600}
.cust-top span{font-family:'JetBrains Mono',monospace;color:var(--mint);font-weight:600}
.track{height:6px;border-radius:6px;background:rgba(255,255,255,0.06);overflow:hidden}
.fill{height:100%;border-radius:6px}
@keyframes grow{from{width:0}}.fill,.rfill{animation:grow 1s ease both}
.region-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.region-info{flex:1;min-width:0}
.region-info b{font-size:12px}
.region-info p{font-size:10px;color:var(--muted)}

/* Tracking */
.track-layout{display:grid;grid-template-columns:300px 1fr;gap:14px}
.ship-list{display:flex;flex-direction:column;gap:8px;max-height:72vh;overflow-y:auto}
.search-box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:11px 14px;margin-bottom:12px}
.search-box input{background:none;border:none;outline:none;color:var(--text);font-size:13px;width:100%;font-family:'Sora',sans-serif}
.search-box input::placeholder{color:var(--muted)}
.ship{padding:13px 15px;border-radius:14px;background:var(--card);border:1px solid var(--border);cursor:pointer;transition:.2s;border-left:3px solid transparent}
.ship:hover{background:var(--card2)}
.ship.active{border-left-color:var(--mint);background:rgba(94,234,212,0.06)}
.ship-ci{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--sky)}
.ship-cust{font-size:12px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ship-meta{font-size:10px;color:var(--muted);margin-top:3px}
.ship-val{font-size:12px;font-weight:700;color:var(--mint);font-family:'JetBrains Mono',monospace;margin-top:5px}
.stbadge{font-size:9px;padding:2px 8px;border-radius:20px;font-weight:700;border:1px solid;white-space:nowrap}
.st-delivered{background:rgba(52,211,153,0.12);color:var(--green);border-color:rgba(52,211,153,0.3)}
.st-vessel{background:rgba(56,189,248,0.12);color:var(--sky);border-color:rgba(56,189,248,0.3)}
.st-customs{background:rgba(251,191,36,0.12);color:var(--gold);border-color:rgba(251,191,36,0.3)}
.st-pk{background:rgba(167,139,250,0.12);color:var(--violet);border-color:rgba(167,139,250,0.3)}
.st-booking{background:rgba(138,150,184,0.12);color:var(--muted);border-color:rgba(138,150,184,0.3)}
.st-pend{background:rgba(251,113,133,0.12);color:var(--rose);border-color:rgba(251,113,133,0.3)}
.detail{display:flex;flex-direction:column;gap:14px}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.detail-ci{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.detail-name{font-size:22px;font-weight:800;margin-top:4px}
.detail-sub{display:flex;gap:14px;margin-top:6px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.detail-val{font-size:24px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--mint)}
.miles{display:flex;justify-content:space-between;position:relative;margin-top:20px;gap:4px}
.mline{position:absolute;top:19px;left:18px;right:18px;height:1px;background:rgba(255,255,255,0.03)}
.mfill{position:absolute;top:19px;left:18px;height:1px;background:linear-gradient(90deg,rgba(94,234,212,0.3),rgba(56,189,248,0.3));transition:width 1.2s ease}
.mile{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1;position:relative;z-index:1}
.mdot{width:38px;height:38px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--bg)}
.md-done{border-color:var(--mint);background:rgba(94,234,212,0.12);color:var(--mint)}
.md-active{border-color:var(--sky);background:rgba(56,189,248,0.12);color:var(--sky);animation:pulse 2s infinite}
.md-todo{border-color:rgba(255,255,255,0.1);color:var(--muted)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(56,189,248,0.15)}50%{box-shadow:0 0 0 8px rgba(56,189,248,0.03)}}
.mlabel{font-size:9px;font-weight:600;text-align:center}
.msub{font-size:8px;color:var(--muted);text-align:center}
.dcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dcard{background:rgba(255,255,255,0.03);border:1px solid var(--border2);border-radius:12px;padding:13px;display:flex;gap:10px}
.dcard-l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dcard-v{font-size:11px;font-family:'JetBrains Mono',monospace;margin-top:3px;word-break:break-all}
.pay-cols{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:10px;margin-bottom:12px}
.pay-l{font-size:10px;color:var(--muted)}
.pay-a{font-size:17px;font-weight:800;font-family:'JetBrains Mono',monospace;margin-top:4px}

/* Ledger */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters .search-box{margin-bottom:0;width:180px}
.filters select{font-size:12px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 12px;outline:none;font-family:'Sora',sans-serif;cursor:pointer}
.rec-count{margin-left:auto;font-size:12px;color:var(--muted)}
.rec-count b{color:var(--text)}
.table-scroll{overflow-x:auto;border-radius:16px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:980px}
thead{background:rgba(255,255,255,0.04)}
th{padding:12px 13px;text-align:left;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;cursor:pointer}
th:hover{color:var(--text)}
tbody tr{border-top:1px solid var(--border2);transition:.15s}
tbody tr:hover{background:rgba(94,234,212,0.05)}
td{padding:11px 13px;color:var(--muted);white-space:nowrap}
.ci-c{color:var(--sky);font-family:'JetBrains Mono',monospace;font-weight:600}
.mono{font-family:'JetBrains Mono',monospace}
.tw{color:var(--text);font-weight:600;font-family:'JetBrains Mono',monospace}
.tg{color:var(--mint);font-family:'JetBrains Mono',monospace;font-weight:600}
.tr{color:var(--rose);font-family:'JetBrains Mono',monospace;font-weight:600}
.bk{padding:2px 8px;border-radius:20px;font-size:9px;font-weight:700}
.bk-h{background:rgba(56,189,248,0.15);color:var(--sky)}
.bk-a{background:rgba(167,139,250,0.15);color:var(--violet)}
.stat-b{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:9px;font-weight:700;border:1px solid}
.s-recv{background:rgba(52,211,153,0.1);color:var(--green);border-color:rgba(52,211,153,0.3)}
.s-pend{background:rgba(251,113,133,0.1);color:var(--rose);border-color:rgba(251,113,133,0.3)}
.ledger-foot{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:14px;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-radius:16px}
.lf-i{display:flex;flex-direction:column;gap:2px}
.lf-l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lf-v{font-size:15px;font-weight:800;font-family:'JetBrains Mono',monospace}

/* MOBILE */
@media(max-width:900px){
  .hero{grid-template-columns:1fr;gap:10px}
  .hero-big{font-size:36px}
  .kpis{grid-template-columns:1fr 1fr}
  .up-row{grid-template-columns:1fr}
  .charts{grid-template-columns:1fr}
  .bgrid{grid-template-columns:1fr}
  .track-layout{grid-template-columns:1fr;gap:12px}
  .ship-list{max-height:300px;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding-bottom:0}
  .ship{min-width:0;width:100%}
  .detail{min-width:0;overflow-x:hidden}
  .detail-head{flex-direction:column;gap:10px}
  .detail-val{font-size:22px}
  .dcards{grid-template-columns:1fr 1fr}
  .detail-name{font-size:18px}
  .miles{overflow-x:auto;padding-bottom:8px;gap:2px}
  .mile{min-width:64px}
  .mdot{width:32px;height:32px;font-size:12px}
  .pay-cols{gap:6px}
  .pay-a{font-size:15px}
  .topbar{padding:14px}
  .tabpane{padding:14px}
  .tab{padding:10px 13px;font-size:12px}
  .hero-big{font-size:32px}
}
@media(max-width:480px){
  .kpis{grid-template-columns:1fr 1fr}
  .up-grid{grid-template-columns:1fr}
  .brand h1{font-size:15px}
  .dcards{grid-template-columns:1fr}
  .pay-cols{grid-template-columns:1fr;gap:8px}
  .detail-sub{flex-direction:column;gap:5px}
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

function parseMoney(s){ if(!s)return 0; return parseFloat(String(s).replace(/[$,\(\)\-€£\s]/g,'').replace(/[()]/g,''))||0; }
function parseQty(s){ if(!s)return 0; return parseFloat(String(s).replace(/[^0-9.]/g,''))||0; }
function normaliseRegion(s){ if(!s)return'Other'; const r=s.trim(); if(/europ/i.test(r))return'Europe'; return r; }

// Handles Google Sheets dates — ISO strings, Date objects, serial numbers, or M/D/YY strings
function parseSheetDate(val){
  if(!val && val !== 0) return '';
  const s = String(val).trim();
  if(!s) return '';
  // ISO format: 2026-05-16T00:00:00.000Z
  if(s.includes('T') || s.includes('-')){
    const d = new Date(s);
    if(!isNaN(d)) return (d.getUTCMonth()+1) + '/' + d.getUTCDate() + '/' + String(d.getUTCFullYear()).slice(2);
  }
  // Already M/D/YY or M/D/YYYY
  if(s.includes('/')) return s;
  // Number — Google Sheets serial
  const n = parseFloat(s);
  if(!isNaN(n) && n > 1000){
    const d = new Date(Math.round((n - 25569) * 86400 * 1000));
    if(!isNaN(d)) return (d.getUTCMonth()+1) + '/' + d.getUTCDate() + '/' + String(d.getUTCFullYear()).slice(2);
  }
  return s;
}

function parseSheetRow(row, idx){
  const ci = (row['Commercial Invoice']||'').trim();
  if(!ci) return null;
  const value    = parseMoney(row['Invoice Value']);
  const received = parseMoney(row['Received']);
  const pending  = Math.max(0, parseMoney(row['pending']) || Math.max(0, value - received));
  return {
    sr:         parseInt(row['Sr#'])||idx+1,
    ci,
    pi:         (row['Proforma Invoice']||'').trim(),
    date:       parseSheetDate(row['Invoice Date']),
    customer:   (row['Customer Name']||'').replace(/\n/g,' ').trim(),
    etd:        parseSheetDate(row['ETD']),
    eta:        parseSheetDate(row['ETA']),
    bl:         String(row['BL/AWB']||'').trim(),
    bank:       (row['Bank']||'').trim(),
    gd:         (row['GD #']||'').trim(),
    fi:         (row['FI #']||'').replace(/\n/g,' ').trim(),
    country:    (row['Country']||'').trim(),
    city:       (row['City']||'').trim(),
    pod:        (row['POD']||'').trim(),
    region:     normaliseRegion(row['Region']||''),
    product:    (row['Product']||'').replace(/\n/g,' / ').trim(),
    qty:        parseQty(row['Quantity']),
    containers: (row['Containers']||'').trim(),
    value,
    received,
    pending,
    status:     (row['Payment Status']||'Pending').trim(),
    remarks:    (row['Remarks']||'').trim(),
    stage:      undefined,
  };
}

function daysBetween(a,b){if(!a||!b)return null;return Math.round((b-a)/86400000);}
function shipmentStage(r){if(r.stage)return r.stage;const rem=(r.remarks||'').toLowerCase();const now=new Date();now.setHours(0,0,0,0);const e=parseDate(r.eta);if(rem.includes('delivered'))return'delivered';if(e&&e<=now&&rem.includes('shipped'))return'delivered';if(rem.includes('shipped'))return'vessel';if(rem.includes('loading'))return'loading';if(rem.includes('destination customs')||rem.includes('dest customs'))return'customs';if(r.gd&&r.gd.trim())return'pakistan_customs';return'booking';}

function lineChart(id,labels,series){
  const c=document.getElementById(id);if(!c)return;const p=c.parentElement;
  c.width=p.clientWidth||600;c.height=180;const x=c.getContext('2d');
  const W=c.width,H=c.height,pad={t:12,r:12,b:28,l:52},iW=W-pad.l-pad.r,iH=H-pad.t-pad.b;
  x.clearRect(0,0,W,H);const all=series.flatMap(s=>s.data);const mx=Math.max(...all)*1.1||1;
  x.strokeStyle='rgba(255,255,255,0.05)';x.lineWidth=1;
  for(let i=0;i<=4;i++){const y=pad.t+iH*(1-i/4);x.beginPath();x.moveTo(pad.l,y);x.lineTo(pad.l+iW,y);x.stroke();
    x.fillStyle='#6878a0';x.font='9px JetBrains Mono';x.textAlign='right';x.fillText('$'+(mx*i/4/1000).toFixed(0)+'k',pad.l-6,y+3);}
  const step=iW/(labels.length-1||1);x.textAlign='center';
  labels.forEach((l,i)=>{x.fillStyle='#6878a0';x.font='9px Sora';x.fillText(l,pad.l+i*step,H-8);});
  series.forEach(s=>{const pts=s.data.map((v,i)=>({x:pad.l+i*step,y:pad.t+iH*(1-v/mx)}));
    const g=x.createLinearGradient(0,pad.t,0,pad.t+iH);g.addColorStop(0,s.color+'40');g.addColorStop(1,s.color+'00');
    x.beginPath();x.moveTo(pts[0].x,pad.t+iH);pts.forEach(pt=>x.lineTo(pt.x,pt.y));x.lineTo(pts[pts.length-1].x,pad.t+iH);x.closePath();x.fillStyle=g;x.fill();
    x.beginPath();pts.forEach((pt,i)=>i?x.lineTo(pt.x,pt.y):x.moveTo(pt.x,pt.y));x.strokeStyle=s.color;x.lineWidth=2.5;x.stroke();
    pts.forEach(pt=>{x.beginPath();x.arc(pt.x,pt.y,3,0,7);x.fillStyle=s.color;x.fill();});});
}
function vbarChart(id,labels,values,colors,unit){
  const c=document.getElementById(id);if(!c)return;const p=c.parentElement;
  c.width=p.clientWidth||400;c.height=p.clientHeight||180;const x=c.getContext('2d');
  const W=c.width,H=c.height,pad={t:26,r:8,b:38,l:8},iW=W-pad.l-pad.r,iH=H-pad.t-pad.b;
  x.clearRect(0,0,W,H);const mx=Math.max(...values)*1.14||1;const n=labels.length;
  x.strokeStyle='rgba(255,255,255,0.04)';for(let i=1;i<=4;i++){const y=pad.t+iH/4*i;x.beginPath();x.moveTo(pad.l,y);x.lineTo(W-pad.r,y);x.stroke();}
  const bw=Math.min(40,iW/n*0.62),gap=(iW-bw*n)/(n+1);
  values.forEach((v,i)=>{const bx=pad.l+gap*(i+1)+bw*i,bh=Math.max(4,v/mx*iH),by=pad.t+iH-bh,col=colors[i%colors.length];
    const g=x.createLinearGradient(0,by,0,by+bh);g.addColorStop(0,col);g.addColorStop(1,col+'33');x.fillStyle=g;
    if(x.roundRect){x.beginPath();x.roundRect(bx,by,bw,bh,5);x.fill();}else x.fillRect(bx,by,bw,bh);
    x.fillStyle=col;x.font='bold 10px JetBrains Mono';x.textAlign='center';
    const vs=unit==='%'?v+'%':v>=1000?'$'+(v/1000).toFixed(0)+'k':'$'+v;x.fillText(vs,bx+bw/2,by-7);
    x.fillStyle='#8a96b8';x.font='9px Sora';const lb=labels[i].length>8?labels[i].slice(0,8)+'…':labels[i];x.fillText(lb,bx+bw/2,pad.t+iH+15);});
}

// ── Map zoom/pan state ──
let _mapZ=1,_mapX=0,_mapY=0;
function applyMapTransform(){const s=document.getElementById('mapSvg');if(s)s.style.transform=`translate(${_mapX}px,${_mapY}px) scale(${_mapZ})`;}
function mapZoom(f){_mapZ=Math.min(5,Math.max(1,_mapZ*f));if(_mapZ===1){_mapX=0;_mapY=0;}applyMapTransform();}
function mapReset(){_mapZ=1;_mapX=0;_mapY=0;applyMapTransform();}
function setupMapPanZoom(){
  const vp=document.getElementById('mapViewport');if(!vp)return;
  let dragging=false,sx=0,sy=0,ox=0,oy=0;
  vp.addEventListener('wheel',e=>{e.preventDefault();mapZoom(e.deltaY<0?1.15:0.87);},{passive:false});
  const down=(x,y)=>{dragging=true;sx=x;sy=y;ox=_mapX;oy=_mapY;vp.style.cursor='grabbing';};
  const move=(x,y)=>{if(!dragging)return;_mapX=ox+(x-sx);_mapY=oy+(y-sy);applyMapTransform();};
  const up=()=>{dragging=false;vp.style.cursor='grab';};
  vp.addEventListener('mousedown',e=>down(e.clientX,e.clientY));
  window.addEventListener('mousemove',e=>move(e.clientX,e.clientY));
  window.addEventListener('mouseup',up);
  vp.addEventListener('touchstart',e=>{if(e.touches.length===1)down(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  vp.addEventListener('touchmove',e=>{if(e.touches.length===1){move(e.touches[0].clientX,e.touches[0].clientY);}else if(e.touches.length===2){
    // pinch zoom
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(vp._pd){mapZoom(d>vp._pd?1.03:0.97);}vp._pd=d;
  }},{passive:true});
  vp.addEventListener('touchend',()=>{up();vp._pd=null;});
}

function fetchSheet(){

  // Try fetch first (mobile/hosted)
  fetch(SHEET_URL+'?t='+Date.now()).then(r=>r.json()).then(resp=>{
    clearTimeout(to);const rows=Array.isArray(resp)?resp:(resp.data||resp.values||[]);const p=rows.map((r,i)=>parseSheetRow(r,i)).filter(Boolean);
    if(p.length===0)throw 0;loadData(p,'sheet');_timer=setTimeout(fetchSheet,300000);
  }).catch(()=>{
    // JSONP fallback
    window[cb]=function(resp){clearTimeout(to);window[cb]=null;try{const rows=Array.isArray(resp)?resp:(resp.data||resp.values||[]);const p=rows.map((r,i)=>parseSheetRow(r,i)).filter(Boolean);if(p.length===0)throw 0;loadData(p,'sheet');_timer=setTimeout(fetchSheet,300000);}catch(e){_timer=setTimeout(fetchSheet,180000);}};
    const s=document.createElement('script');s.src=SHEET_URL+'?callback='+cb+'&t='+Date.now();s.onerror=()=>{clearTimeout(to);_timer=setTimeout(fetchSheet,180000);};document.head.appendChild(s);
  });
}

function showInstallBtn(){
  if(document.getElementById('installBtn'))return;
  const b=document.createElement('button');
  b.id='installBtn';b.textContent='📲 Install App';
  b.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9998;padding:11px 20px;border:none;border-radius:30px;background:linear-gradient(135deg,#5eead4,#38bdf8);color:#06121a;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 8px 24px rgba(94,234,212,0.4);font-family:Sora,sans-serif';
  b.onclick=async()=>{if(_deferredPrompt){_deferredPrompt.prompt();await _deferredPrompt.userChoice;_deferredPrompt=null;b.remove();}};
  document.body.appendChild(b);
}
window.addEventListener('appinstalled',()=>{const b=document.getElementById('installBtn');if(b)b.remove();});
</script>
</body>
